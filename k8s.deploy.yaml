apiVersion: apps/v1
kind: Deployment
metadata:
    name: discovery
    labels:
        app: discovery
spec:
    replicas: 3
    selector:
        matchLabels:
            app: discovery
    template:
        metadata:
            labels:
                app: discovery
        spec:
            containers:
                - name: discovery
                  image: eventsourcing-discovery:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8761

---
apiVersion: v1
kind: Service
metadata:
    name: discovery 
spec:
    selector:
        app: discovery
    ports:
        - protocol: TCP
          port: 8761
          targetPort: 8761
    type: NodePort

---
# Apigateway Deployment và Service
apiVersion: apps/v1
kind: Deployment
metadata:
    name: apigateway
spec:
    replicas: 2
    selector:
        matchLabels:
            app: apigateway
    template:
        metadata:
            labels:
                app: apigateway
        spec:
            containers:
                - name: apigateway
                  image: eventsourcing-apigateway:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
    name: apigateway
spec:
    selector:
        app: apigateway
    ports:
        - protocol: TCP
          port: 80
          targetPort: 8080
    type: NodePort