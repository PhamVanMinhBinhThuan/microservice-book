apiVersion: apps/v1
kind: Deployment
metadata:
    name: discovery
    labels:
        app: discovery
spec:
    replicas: 3
    selector:
        matchLabels:
            app: discovery
    template:
        metadata:
            labels:
                app: discovery
        spec:
            containers:
                - name: discovery
                  image: eventsourcing-discovery:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 8761

---
apiVersion: v1
kind: Service
metadata:
    name: discovery 
spec:
    selector:
        app: discovery
    ports:
        - protocol: TCP
          port: 8761
          targetPort: 8761
    type: NodePort