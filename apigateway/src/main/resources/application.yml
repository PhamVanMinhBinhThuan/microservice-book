server:
    port: 8080

spring:
    application:
        name: gateway-service
    data:
        redis:
            port: 6379
            host: localhost
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true
                    lower-case-service-id: true
            routes:
                - id: employeeservice
                  uri: lb://employeeservice
                  predicates:
                    - Path=/api/v1/employees/**
                  filters:
                    - name: RequestRateLimiter
                      args:
                        key-resolver: "#{@keyResolver}"
                        redis-rate-limiter.replenishRate: 10
                        redis-rate-limiter.burstCapacity: 20
                        redis-rate-limiter.requestedTokens: 1
                    - KeyAuthFilter
                - id: bookservice
                  uri: lb://bookservice
                  predicates:
                    - Path=/api/v1/books/**
                  filters:
                    - name: RequestRateLimiter
                      args:
                        key-resolver: "#{@keyResolver}"
                        redis-rate-limiter.replenishRate: 10
                        redis-rate-limiter.burstCapacity: 20
                        redis-rate-limiter.requestedTokens: 1
                    - KeyAuthFilter

eureka:
    instance:
        hostname: discovery
    client:
        service-url:
            defaultZone: http://discovery:8761/eureka/
            register-with-eureka: true
            fetch-registry: true
