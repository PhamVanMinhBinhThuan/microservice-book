server:
    port: 8080

spring:
    application:
        name: gateway-service
    data:
        redis:
            port: 6379
            host: localhost
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true
                    lower-case-service-id: true
            routes:
                - id: employeeservice
                  uri: lb://employeeservice
                  predicates:
                    - Path=/api/v1/employees/**
                  filters:
                    - name: RequestRateLimiter
                      args:
                        key-resolver: "#{@keyResolver}"
                        redis-rate-limiter.replenishRate: 10
                        redis-rate-limiter.burstCapacity: 20
                        redis-rate-limiter.requestedTokens: 1
                    - KeyAuthFilter
                - id: bookservice
                  uri: lb://bookservice
                  predicates:
                    - Path=/api/v1/books/**
                  filters:
                    - name: RequestRateLimiter
                      args:
                        key-resolver: "#{@keyResolver}"
                        redis-rate-limiter.replenishRate: 10
                        redis-rate-limiter.burstCapacity: 20
                        redis-rate-limiter.requestedTokens: 1
                    - KeyAuthFilter
                - id: userservice
                  uri: http://localhost:9006
                  predicates:
                    - Path=/api/v1/users/**
                  filters:
                    - name: JwtHeaderFilter
                - id: userservice-public
                  uri: http://localhost:9006
                  predicates:
                    - Path=/api/v1/public/**
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8180/realms/ltfullstack
eureka:
    instance:
        hostname: localhost
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
            register-with-eureka: true
            fetch-registry: true
